name: Publish Extension & Package
on:
  # push:
  #   tags:
  #     - "v*.*.*"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  publish:
    # Holds the registry tokens; deploys only from `v*` tags. npm trusted
    # publishing is also bound to this environment name and to this file name.
    environment: production
    permissions:
      contents: write # Required for uploading release assets
      id-token: write # npm trusted publishing (OIDC); no npm token is stored

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from `packageManager` in package.json.
      - name: 💾 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          # No dependency cache in a release job: a cache written by another
          # workflow run must not feed what gets published. setup-node only
          # auto-caches npm projects, but its README recommends turning this
          # off explicitly in privileged workflows.
          package-manager-cache: false

      - name: 💾 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Package Extension (.vsix)
        id: package
        run: |
          pnpm build
          vsix=$(echo *.vsix)
          sha256sum "$vsix" > "$vsix.sha256"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload VSIX to GitHub Release
        # uses: ncipollo/release-action@v1.20.0
        # with:
        #   artifacts: "*.vsix" "*.vsix.sha256"
        #   token: ${{ secrets.GITHUB_TOKEN }}
        #   allowUpdates: true # ensures we can update the release with assets
        #   replacesArtifacts: false
        #   tag: ${{ github.event.release.tag_name }}
        # TODO: switch to ncipollo/release-action when it supports updating existing releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.ref_type == 'tag'
        with:
          files: |
            *.vsix
            *.vsix.sha256

      # Both extension registries get the .vsix built and checksummed above,
      # the one attached to the GitHub release.
      - name: 📤 Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          extensionFile: ${{ steps.package.outputs.vsix }}
          pat: ${{ secrets.OPEN_VSX_TOKEN }}

      - name: 📤 Publish to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.package.outputs.vsix }}
          pat: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}

      # Last, so a registry problem here cannot hold back the extension.
      # Authenticates with npm trusted publishing; provenance is attached.
      - name: 📤 Publish to npmjs
        run: pnpm publish:npmjs


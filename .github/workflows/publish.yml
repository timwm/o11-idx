  notify-contributors:
    # needs: [add-contributors, publish]
    # if: needs.add-contributors.outputs.contributors-generated == 'true'
    needs: publish
    permissions:
      contents: read
      issues: write # PR comments go through the issues API
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💬 Comment on Related PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.payload.release.tag_name;

            try {
              // Get the previous tag
              const { data: tags } = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                sort: 'created',
                direction: 'desc'
              });
              
              const currentTagIndex = tags.findIndex(t => t.name === tag);
              const previousTag = currentTagIndex < tags.length - 1 ? tags[currentTagIndex + 1]?.name : null;
              
              if (!previousTag) {
                console.log('No previous tag found, this might be the first release');
                return;
              }
              
              // Get commits between previous tag and current tag
              const { data: comparison } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: previousTag,
                head: tag
              });
              
              const commits = comparison.commits;
              const prNumbers = new Set();
              
              // Extract PR numbers from commit messages
              for (const commit of commits) {
                const matches = commit.commit.message.match(/#(\d+)/g);
                if (matches) {
                  matches.forEach(match => prNumbers.add(match.replace('#', '')));
                }
              }
              
              console.log(`Found ${prNumbers.size} PR(s) to notify`);
              
              // Comment on each PR
              for (const prNumber of prNumbers) {
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(prNumber),
                    body: `🎉 Thank you for your contribution! 🙏. This pull request has been included in release [${tag}](${context.payload.release.html_url})`
                  });
                  console.log(`✅ Commented on PR #${prNumber}`);
                } catch (error) {
                  console.log(`⚠️ Could not comment on PR #${prNumber}: ${error.message}`);
                }
              }
            } catch (error) {
              console.error(`Error in notification job: ${error.message}`);
            }
